# Use exactly one profile and set matching storage in pmem.json.
x-app: &app
  build: .
  image: pmem:local
  init: true
  restart: unless-stopped
  ports:
    - "127.0.0.1:3000:3000"
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  pmem-local:
    <<: *app
    profiles: [local]
    volumes:
      - ./pmem.json:/config/pmem.json:ro
      - notes:/data
  pmem-oss:
    <<: *app
    profiles: [oss]
    volumes:
      - ./pmem.json:/config/pmem.json:ro
      - state:/state
volumes:
  notes:
  state:
