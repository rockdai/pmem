name: Publish to npm
on:
  release:
    types: [published]
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Check package version
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}, got ${process.env.RELEASE_TAG}`);
          }

          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm registry check failed: HTTP ${response.status}`);
          }
          const published = response.status === 200;
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          console.log(`${name}@${version}: ${published ? 'already published; skipping publish' : 'ready to publish'}`);
          NODE
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:package
      - name: Publish package
        if: steps.package.outputs.published == 'false'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
